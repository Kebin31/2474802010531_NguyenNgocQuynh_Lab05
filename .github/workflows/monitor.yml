name: ReqRes Monitor

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check availability and response time
        env:
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
        run: |
          node <<'NODE'
          const { performance } = require("node:perf_hooks");

          async function main() {
            const apiKey = process.env.REQRES_API_KEY;

            if (!apiKey) {
              throw new Error("Missing repository secret REQRES_API_KEY");
            }

            const start = performance.now();

            const response = await fetch(
              "https://reqres.in/api/users?page=1",
              {
                headers: {
                  "x-api-key": apiKey
                },
                signal: AbortSignal.timeout(15000)
              }
            );

            await response.arrayBuffer();
            const responseTime = performance.now() - start;

            console.log(`Status: ${response.status}`);
            console.log(`Response time: ${responseTime.toFixed(2)} ms`);

            const failures = [];

            if (response.status !== 200) {
              failures.push(`Expected status 200, received ${response.status}`);
            }

            if (responseTime >= 800) {
              failures.push(
                `Expected response time below 800 ms, received ${responseTime.toFixed(2)} ms`
              );
            }

            if (failures.length > 0) {
              throw new Error(failures.join("\n"));
            }

            console.log("PASS: Status is 200");
            console.log("PASS: Response time is below 800 ms");
          }

          main().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE
